server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  error:
    include-message: always

spring:
  application:
    name: sanitation-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sanitation_hub}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:11111111}
    hikari:
      pool-name: SanitationHubPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
  cache:
    type: redis
    redis:
      time-to-live: 600000   # 10 min default (ms); overridden per cache in CacheConfig
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_FROM:noreply@sanitation-hub.unza.ac.zm}
    base-url: ${APP_BASE_URL:http://localhost:3000}
    enabled: ${MAIL_ENABLED:false}
  security:
    rate-limit:
      login-max: ${RATE_LIMIT_LOGIN:10}
      register-max: ${RATE_LIMIT_REGISTER:5}
      window-seconds: ${RATE_LIMIT_WINDOW:60}
    lockout:
      max-attempts: ${LOCKOUT_MAX_ATTEMPTS:5}
      duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
  cors:
    allowed-origin-patterns:
      - "*"
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-strong-secret-key-in-production-please}
    expiration: PT12H
  storage:
    root: ${STORAGE_ROOT:storage}
  backup:
    dir: ${BACKUP_DIR:backups}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@sanitation-hub.local}
    admin-password: ${ADMIN_PASSWORD:Admin@123456}
    admin-name: ${ADMIN_NAME:System Administrator}
  captcha:
    enabled: ${CAPTCHA_ENABLED:true}
    provider: ${CAPTCHA_PROVIDER:recaptcha}
    site-key: ${CAPTCHA_SITE_KEY:6LdwDDwtAAAAAOolPyxc4Orz0VLTAlMid3EPnPw0}
    secret-key: ${CAPTCHA_SECRET_KEY:6LdwDDwtAAAAAGMtCNjGvXZ9Y71n45Zm7EYGjvRq}
  ldap:
    enabled: ${LDAP_ENABLED:false}
    url: ${LDAP_URL:ldap://ldap.unza.zm:389}
    base-dn: ${LDAP_BASE_DN:dc=unza,dc=zm}
    user-dn-pattern: ${LDAP_USER_DN_PATTERN:uid={0},ou=People}
    user-search-base: ${LDAP_USER_SEARCH_BASE:ou=People}
    user-search-filter: ${LDAP_USER_SEARCH_FILTER:(uid={0})}
    email-attribute: ${LDAP_EMAIL_ATTR:mail}
    name-attribute: ${LDAP_NAME_ATTR:cn}
    manager-dn: ${LDAP_MANAGER_DN:}
    manager-password: ${LDAP_MANAGER_PASSWORD:}
